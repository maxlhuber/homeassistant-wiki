automation_overrides:
  "Auto-Laden Session Start (Snapshot)":
    technical: true
    description: "Merkt sich beim Anstecken die Zählerstände, damit Home Assistant später Energieanteile und Kosten dieser Ladesitzung berechnen kann. Der Ladevorgang wird dadurch nicht gestartet."
    manual: "Keine Bedienung im Alltag. Bei einer falschen Ladezusammenfassung den tatsächlichen Zähler- und Fahrzeugstand notieren und Max informieren."

  "Auto-Laden Zusammenfassung (Push)":
    description: "Sendet Max nach dem Vollladen oder Abstecken eine Zusammenfassung zu geladener Energie, Solar- und Netzanteil sowie durchschnittlichem Preis."
    manual: "Die Nachricht ist nur eine Auswertung. Den wirklichen Ladezustand am Fahrzeug oder an der Wallbox prüfen."
    trigger_steps:
      - "Die Wallbox meldet „voll geladen“ oder das Auto ist seit fünf Sekunden abgesteckt."
    condition_steps:
      - "Diese Ladesitzung wurde noch nicht abgerechnet und die benötigten Zählerwerte sind vorhanden."
    action_steps:
      - "Home Assistant markiert die Ladesitzung als abgerechnet."
      - "Max erhält eine Zusammenfassung zu Energie, Solar-/Netzanteil und durchschnittlichem Preis."

  "Benachrichtigung Rauchmelder Büro":
    description: "Sendet Max und Meike eine zusätzliche Alarmmeldung, wenn der Rauchmelder im Büro Rauch erkennt."
    result_append:
      - "Push-Nachricht an Meikes iPhone senden"
      - "Beide Versandwege werden unabhängig voneinander versucht."
    safety_note: "Die Handy-Meldung ist nur eine Zusatzwarnung. Bei Rauch oder Feuer Menschen in Sicherheit bringen und im Zweifel 112 wählen."
    manual: "Nicht auf die App warten: Den hörbaren Rauchmelder und die Situation vor Ort ernst nehmen. Nur bei sicher erkanntem Fehlalarm lüften und den Melder nach Herstelleranleitung prüfen."
    trigger_steps:
      - "Der Rauchmelder im Büro erkennt Rauch."

  "Benachrichtigung Fensterkontakt Bad":
    trigger_steps:
      - "Das Badfenster wird geöffnet und bleibt 30 Minuten offen."

  "Benachrichtigung Speisekammer Türe":
    trigger_steps:
      - "Die Speisekammertür wird geöffnet und bleibt 30 Minuten offen."

  "Batterie-Warnung täglich 09:00 (< 30%, ohne Mobile-App)":
    condition_steps:
      - "Mindestens ein berücksichtigter Batterie-Sensor meldet weniger als 30 Prozent."
    action_steps:
      - "Home Assistant ermittelt die betroffenen Geräte."
      - "Für jedes betroffene Gerät wird eine Push-Nachricht mit dem Batteriestand gesendet."
    manual: "Das genannte Gerät aufsuchen und Batterie beziehungsweise Ladezustand direkt prüfen. Eine fehlende Meldung ändert den Gerätezustand nicht."

  "Müllabfuhr Benachrichtigung Zentral":
    action_steps:
      - "Home Assistant sammelt alle Müllarten, die am nächsten Tag abgeholt werden."
      - "Wenn mindestens eine Abholung ansteht, erhalten Max und Meike um 18:00 Uhr eine gemeinsame Erinnerung."
    manual: "Bei einer fehlenden oder unklaren Meldung den Abfuhrtermin im Kalender beziehungsweise beim Entsorger prüfen."

  "Pflanzenerinnerung":
    condition_steps:
      - "Es ist der 1. oder 14. Tag des Monats."
    action_steps:
      - "Home Assistant sendet eine Erinnerung zum Pflanzengießen."
      - "Die Erinnerung wird alle drei Stunden wiederholt, bis sie in der Handy-Meldung als erledigt bestätigt wird."
    manual: "Die Erinnerung kann über die Aktion „gegossen“ in der Handy-Meldung beendet werden. Sie schaltet kein Wasserventil."

  "Spülmaschine fertig Blueprint":
    title: "Spülmaschine ist fertig"
    description: "Benachrichtigt Max und Meike, wenn die Spülmaschine laut gemessener Leistungsaufnahme fertig ist."
    result_append:
      - "Max und Meike erhalten jeweils eine Push-Nachricht."
      - "Fällt ein Versandweg aus, wird der andere trotzdem versucht."
    manual: "Die Spülmaschine funktioniert unabhängig von dieser Meldung. Bleibt die Nachricht aus, Programmende direkt am Gerät prüfen."

  "Licht Standardhelligkeit bei Einschalten":
    title: "Automatische Standardhelligkeit"
    description: "Setzt bei einem Einschaltbefehl ohne gewählte Helligkeit normalerweise 100 %. Im Flur, Schlafzimmer und Bad werden die Hauptlichter nachts auf 1 % gesetzt. Eine ausdrücklich gewählte Helligkeit wird nicht verändert."
    manual: "Die gewünschte Helligkeit am Wandschalter oder in Home Assistant direkt einstellen. Eine ausdrücklich gewählte Helligkeit hat Vorrang."
    trigger_steps:
      - "Ein unterstütztes Licht erhält einen Einschaltbefehl."
    condition_steps:
      - "Beim Einschalten wurde keine feste Helligkeit mitgegeben."
    action_steps:
      - "Home Assistant setzt je nach Uhrzeit und Raum die oben beschriebene Standardhelligkeit."

  "Lichtschalter Bad":
    trigger_steps:
      - "Die linke Taste am Wandschalter im Bad wird gedrückt."
    action_steps:
      - "Ist das Badlicht an, wird es ausgeschaltet."
      - "Ist es aus, wird es nachts mit 30 Prozent und tagsüber mit 100 Prozent Helligkeit eingeschaltet."

  "Lichtschalter Diele Eingang":
    action_steps:
      - "Ist das Flurlicht an, wird es ausgeschaltet."
      - "Ist es aus, wird es nachts mit 30 Prozent und tagsüber mit 100 Prozent Helligkeit eingeschaltet."

  "Lichtschalter Diele Wohnzimmer":
    action_steps:
      - "Ist das Flurlicht an, wird es ausgeschaltet."
      - "Ist es aus, wird es nachts mit 30 Prozent und tagsüber mit 100 Prozent Helligkeit eingeschaltet."

  "Lichtschalter Kinderzimmerflur":
    action_steps:
      - "Ist das Flurlicht an, wird es ausgeschaltet."
      - "Ist es aus, wird es nachts mit 30 Prozent und tagsüber mit 100 Prozent Helligkeit eingeschaltet."

  "Lichtschalter Schlafzimmer":
    action_steps:
      - "Ist das Schlafzimmerlicht an, wird es ausgeschaltet."
      - "Ist es aus, wird es nachts mit 30 Prozent und tagsüber mit 100 Prozent Helligkeit eingeschaltet."

  "Präsenzmelder Flur Licht an":
    title: "Flurlicht bei Anwesenheit einschalten"
    description: "Schaltet das Flurlicht bei erkannter Anwesenheit zwischen 08:00 und 18:00 Uhr mit 100 % Helligkeit ein. Außerhalb dieses Zeitfensters erfolgt derzeit keine Aktion."

  "Licht Flur aus 22 Uhr":
    title: "Dielenlicht um 22:00 Uhr ausschalten"
    description: "Schaltet die Lichtgruppe „Diele“ jeden Abend um 22:00 Uhr aus."

  "Wallbox Benachrichtigung":
    title: "Ladebeginn an Max melden"
    description: "Informiert Max, wenn die Wallbox aktiv lädt, das Auto angeschlossen ist und noch nicht voll geladen wurde."
    result_append:
      - "Die Nachricht nennt den aktuellen Strompreis in ct/kWh."
    manual: "Den tatsächlichen Ladezustand im Fahrzeug oder an der Wallbox prüfen. Eine fehlende Nachricht stoppt oder startet keinen Ladevorgang."
    area_ids:
      - garage
    trigger_steps:
      - "Die Wallbox wechselt in den Lademodus."
    condition_steps:
      - "Das Auto ist angeschlossen, lädt gerade und ist noch nicht voll."
    action_steps:
      - "Max erhält eine Push-Nachricht zum Ladebeginn mit dem aktuellen Strompreis in ct/kWh."

  "Wallbox Benachrichtigung 2":
    title: "Laden bei Anwesenheit anbieten"
    manual: "Den tatsächlichen Ladezustand im Fahrzeug oder an der Wallbox prüfen. Bei Unklarheit keine Ladefreigabe nur aufgrund einer Push-Nachricht erteilen."
    area_ids:
      - garage
    trigger_steps:
      - "Home Assistant erhält das Signal, eine mögliche Ladung zu prüfen."
    condition_steps:
      - "Das Auto ist zu Hause, noch nicht angeschlossen und noch nicht voll geladen."
    action_steps:
      - "Max erhält eine Push-Nachricht mit dem aktuellen Strompreis und dem Ladeangebot."

  "Wallbox Zentrale Steuerung":
    trigger_steps:
      - "Der gewünschte Ladezustand ändert sich oder das Auto wird angesteckt."
    condition_steps:
      - "Das Auto ist an der Wallbox angeschlossen."
    action_steps:
      - "Bei „Sicherheitsladen“ oder „preisoptimiert laden“ gibt Home Assistant das Laden frei."
      - "Bei „Warten“ oder „voll geladen“ stoppt Home Assistant die Ladefreigabe."

  "Wallbox Override Reset":
    enabled: false
    status_reason: "Die früher verwendete Wallbox-Override-Funktion existiert nicht mehr. Diese Automation bleibt deshalb ausgeschaltet."
    manual: "Nicht verwenden. Die Seite bleibt nur als Wartungshinweis erhalten."

  "System - Recorder täglich auf 30 Tage begrenzen":
    enabled: false
    technical: true
    status_reason: "Ausgeschaltet, weil Home Assistant die Aufbewahrungsdauer bereits selbst verwaltet."

  "System - Recorder wöchentlich repacken":
    enabled: false
    technical: true
    status_reason: "Ausgeschaltet; dieser zusätzliche Wartungsschritt ist derzeit nicht erforderlich."

  "System - Recorder Diagnosewerte täglich bereinigen":
    technical: true

  "Tibber API Timer":
    technical: true

  "Tibber Reload":
    technical: true

  "Pflanzenerinnerung Helfer":
    technical: true

  "Bewässerung Urlaub":
    title: "Gartenbewässerung täglich um 09:00 Uhr"
    description: "Wenn diese Automation eingeschaltet ist, öffnet sie das Gartenventil jeden Tag um 09:00 Uhr für zwei Minuten. Ein Urlaubsmodus wird derzeit nicht geprüft."
    safety_note: "Der Name in Home Assistant ist missverständlich: Die Bewässerung läuft täglich, nicht nur im Urlaub."
    manual: "In Home Assistant kann die Automation ausgeschaltet werden. Nach einer manuellen Betätigung prüfen, ob das Gartenventil wieder geschlossen ist."

  "Tür öffnen wenn Max zuhause ankommt":
    title: "Haustür öffnen, wenn Max oder Meike ankommen"
    description: "Öffnet den Nuki-Öffner, wenn das iPhone von Max oder Meike nach einer Abwesenheit seit 30 Sekunden wieder als zu Hause erkannt wird. Weitere Bedingungen sind nicht hinterlegt."
    safety_note: "Eine ungenaue Standorterkennung kann die Tür unerwartet öffnen. Bei einer unerwarteten Öffnung Haustür sichern und Max informieren."
    manual: "Wenn die automatische Öffnung ausbleibt, Schlüssel oder Nuki-Bedienung verwenden. Nicht wiederholt durch Weggehen und Zurückkommen testen."
    trigger_steps:
      - "Max’ iPhone oder Meikes iPhone wird nach einer Abwesenheit 30 Sekunden lang als „zu Hause“ erkannt."

  "Lichtschalter Kinderzimmer":
    safety_note: "Raum- und Gerätenamen widersprechen sich: Der „Kinderzimmer“-Schalter steuert laut Home Assistant derzeit das Spielzimmer. Die Zuordnung muss vor Ort bestätigt werden."

  "Lichtschalter Ikea Shortcut Haustüre":
    trigger_steps:
      - "Eine Taste am IKEA-Shortcut an der Haustür wird gedrückt."
    action_steps:
      - "Wenn noch eines der zusammengefassten Lichter außer Büro an ist, schaltet Home Assistant diese Lichter aus."
      - "Sind diese Lichter bereits aus, schaltet Home Assistant den Kronleuchter im Flur ein: nachts mit 30 Prozent, sonst mit 100 Prozent Helligkeit."

  "Lichtschalter Spielzimmer":
    safety_note: "Raum- und Gerätenamen widersprechen sich: Der „Spielzimmer“-Schalter steuert laut Home Assistant derzeit das Kinderzimmer. Die Zuordnung muss vor Ort bestätigt werden."

  "Trockner fertig Blueprint":
    title: "Trockner ist fertig"
    manual: "Der Trockner funktioniert unabhängig von dieser Meldung. Bleibt die Nachricht aus, Programmende direkt am Gerät prüfen."

  "Waschmaschine fertig Blueprint":
    title: "Waschmaschine ist fertig"
