user nginx;
worker_processes 1;
pid /run/nginx/nginx.pid;

events {
    worker_connections 128;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    access_log /dev/stdout;
    error_log /dev/stderr warn;

    sendfile on;
    keepalive_timeout 30;

    server {
        listen 8099;
        server_name _;

        # Home Assistant Ingress is the only allowed entry point.
        allow 172.30.32.2;
        deny all;

        location = /_gateway_health {
            access_log off;
            add_header Content-Type text/plain;
            return 200 "Wiki-Gateway ist bereit\n";
        }

        location = /wiki-offline.html {
            internal;
            root /usr/share/nginx/html;
            add_header Cache-Control "no-store";
        }

        location / {
            proxy_pass http://192.168.1.189;
            proxy_http_version 1.1;
            proxy_set_header Host homeassistant-wiki.local;
            proxy_set_header Connection "";
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_connect_timeout 3s;
            proxy_read_timeout 15s;
            proxy_send_timeout 15s;
            proxy_intercept_errors on;
            error_page 502 503 504 =200 /wiki-offline.html;

            # Seiten und gleichnamige Screenshots können sich beim Wochenlauf
            # ändern. Browser dürfen sie speichern, müssen sie aber vor der
            # Wiederverwendung beim Gateway auf Aktualität prüfen.
            add_header Cache-Control "no-cache, must-revalidate" always;
            add_header X-Content-Type-Options "nosniff" always;
            add_header Referrer-Policy "same-origin" always;
        }
    }
}
