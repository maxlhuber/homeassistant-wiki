<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="dark">
    <title>Haus-Wiki vorübergehend nicht erreichbar</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: #101719;
        color: #e8f0f0;
      }
      body {
        min-height: 100vh;
        display: grid;
        place-items: center;
        margin: 0;
        padding: 1.5rem;
        box-sizing: border-box;
      }
      main {
        width: min(34rem, 100%);
        padding: 1.5rem;
        border: 1px solid #2d4448;
        border-radius: 1rem;
        background: #182326;
        box-shadow: 0 1rem 3rem rgb(0 0 0 / 25%);
      }
      h1 {
        margin-top: 0;
        color: #80cbc4;
        font-size: 1.45rem;
      }
      p {
        line-height: 1.55;
      }
      button {
        border: 0;
        border-radius: 0.75rem;
        padding: 0.8rem 1rem;
        background: #00897b;
        color: white;
        font: inherit;
        font-weight: 650;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Das Haus-Wiki macht gerade eine Pause</h1>
      <p>
        Home Assistant ist erreichbar, aber der Wiki-Raspberry antwortet im Moment
        nicht. Versuche es bitte in ein paar Minuten noch einmal.
      </p>
      <button type="button" onclick="window.location.reload()">Noch einmal versuchen</button>
    </main>
  </body>
</html>
