site_name: Haus-Wiki
site_description: Automatisch erzeugte Home-Assistant-Dokumentation
theme:
  name: material
  language: de
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - search.suggest
plugins:
  - search:
      lang: de
markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences
extra_css:
  - stylesheets/extra.css
nav:
  - Start: index.md
  - Räume: raeume/index.md
  - Geräte: geraete/index.md
  - Automationen: automationen/index.md
  - Dashboards: dashboards/automatisch.md
  - Manuelle Seiten: manuell/index.md
