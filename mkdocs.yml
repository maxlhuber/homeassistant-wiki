site_name: Unser Zuhause
site_description: Verständliche Dokumentation unseres Home-Assistant-Systems
site_author: Familie
site_url: ""

theme:
  name: material
  language: de
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.indexes
    - search.suggest
    - search.highlight
    - content.code.copy
  palette:
    - scheme: slate
      primary: teal
      accent: teal

plugins:
  - search:
      lang: de

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - meta
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true

extra_css:
  - stylesheets/extra.css

nav:
  - Start: index.md
  - Hier starten, Meike: meike/index.md
  - Home Assistant bedienen:
      - bedienung/index.md
      - Einstellungen verstehen: bedienung/einstellungen.md
  - Dashboards:
      - dashboards/index.md
      - Übersicht: dashboards/uebersicht.md
      - Cupra Laden: dashboards/cupra-laden.md
      - Karte: dashboards/karte.md
      - Systemstatus: dashboards/systemstatus.md
      - Weitere Seiten: dashboards/weitere-seiten.md
  - So funktioniert es: grundlagen.md
  - Alltag:
      - alltag/index.md
      - Haus verlassen: alltag/haus-verlassen.md
      - Nach Hause kommen: alltag/nach-hause-kommen.md
      - Schlafengehen: alltag/schlafengehen.md
      - Urlaub: alltag/urlaub.md
  - Räume und Geräte:
      - Räume: raeume/index.md
      - Alle Geräte: geraete/index.md
  - Was passiert automatisch?: automationen/index.md
  - Schnellhilfe:
      - schnellhilfe/index.md
      - Home Assistant nicht erreichbar: schnellhilfe/home-assistant-ausfall.md
      - Internet oder WLAN ausgefallen: schnellhilfe/netzwerk-ausfall.md
      - Hilfe anfordern: schnellhilfe/kontakte.md
  - Wartung für Max:
      - technik/index.md
      - Automatisch erkannte Dashboard-Struktur: dashboards/automatisch.md
      - Systemübersicht: technik/systemuebersicht.md
      - Sicherungen: technik/sicherungen.md
      - Wartung: technik/wartung.md
      - Wiki-Aktualisierung: technik/wiki-aktualisierung.md
